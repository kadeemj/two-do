name: Xcode Cloud Workflow Setup

# Creates (or reuses) the "PR Build & Test" Xcode Cloud workflow via ASC API.
# Does not upload to TestFlight — that stays on ios-testflight.yml.
#
# One-time ASC prerequisites (script exits 2 until done):
#   1. App Store Connect → T2Do → Xcode Cloud → Get Started
#   2. Grant GitHub access to kadeemj/two-do

on:
  workflow_dispatch:

jobs:
  setup:
    name: Create Xcode Cloud workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Create workflow
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 scripts/create_xcode_cloud_workflow.py
